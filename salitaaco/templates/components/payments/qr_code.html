{% comment %}
  The GCash QR code a guardian scans to pay, with the account it pays into.
  setting: the SiteSetting, where an admin sets them on System Settings > General.
{% endcomment %}
<figure class="qrCode">
  {% if setting.has_gcash_qr %}
  <img src="{% url 'view_gcash_qr' %}?v={{ setting.updated_at|date:'U' }}" alt="GCash QR code ng SalitAACo" />
  <figcaption>
    {% if setting.gcash_name %}<b>{{ setting.gcash_name }}</b>{% endif %}
    {% if setting.gcash_number %}<span>GCash {{ setting.gcash_number }}</span>{% endif %}
  </figcaption>
  {% else %}
  <div class="qrMissing" role="img" aria-label="Wala pang QR code">
    <span aria-hidden="true">🔳</span>
    <p>Wala pang QR code</p>
  </div>
  <figcaption>Hindi pa makakabayad. Pakisubukan muli mamaya.</figcaption>
  {% endif %}
</figure>
